name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node probes/bot.js --nights 2 --minutes 8
